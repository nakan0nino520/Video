<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="rating" content="adult"><meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mono – Tìm anime 18+</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#6b6b6b;--line:#e2e2e2;--card:#f5f5f5;--gl:rgba(255,255,255,.55);--glb:rgba(255,255,255,.7);--sh:rgba(0,0,0,.14)}
:root[data-theme=dark]{--bg:#000;--fg:#fff;--mut:#9a9a9a;--line:#262626;--card:#111;--gl:rgba(40,40,40,.45);--glb:rgba(255,255,255,.22);--sh:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:15px/1.5 "Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity .4s;background:radial-gradient(40vmax 40vmax at 15% 10%,#8884,transparent),radial-gradient(45vmax 45vmax at 90% 30%,#6664,transparent),radial-gradient(50vmax 50vmax at 40% 100%,#9994,transparent)}
.glass body::before,body.glass::before{opacity:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* surface: flat by default, liquid glass when body.glass */
.gl{background:var(--bg);border:1px solid var(--line);border-radius:999px}
body.glass .gl{background:var(--gl);backdrop-filter:blur(22px) saturate(190%) brightness(1.05);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.05);border-color:var(--glb);box-shadow:inset 0 1px 0 var(--glb),inset 0 -1px 0 #fff1,inset 1px 0 0 #fff2,0 10px 30px var(--sh)}
header{position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;gap:12px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line)}
body.glass header{background:transparent;border-color:transparent}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em;font-size:18px}
.logo svg{width:28px;height:28px}
form.bar{flex:1;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:44px;max-width:680px;margin:0 auto}
form.bar input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.ib:hover{background:var(--card)}
.ib[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.acts{display:flex;gap:4px;padding:3px}
nav.tabs{display:flex;gap:4px;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding:10px 16px 0}
nav.tabs button{white-space:nowrap;flex:none;display:flex;gap:8px;align-items:center;padding:8px 16px;border-radius:999px;color:var(--mut);border:1px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--fg)}
main{max-width:1200px;margin:0 auto;padding:16px}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;color:var(--mut);font-size:13px}
select{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;max-height:180px;overflow:auto}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--bg)}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#tagq{width:100%;margin-bottom:10px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
#drop{display:grid;place-items:center;gap:8px;text-align:center;padding:40px 16px;border:1.5px dashed var(--mut);border-radius:20px;color:var(--mut);margin-bottom:16px}
#drop[hidden]{display:none}
#drop.on{border-color:var(--fg);color:var(--fg)}
#drop button{padding:8px 18px;border-radius:999px;border:1px solid var(--fg);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px 12px}
.card{display:block;text-decoration:none;color:inherit}
.card .im{aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card);position:relative;border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s,transform .4s}
body.blur .card img,body.blur .card video{filter:blur(16px) grayscale(1)}
body.blur .card:hover img,body.blur .card:focus-visible img,body.blur .card:hover video{filter:none}
.card:hover img{transform:scale(1.03)}
.badge{position:absolute;left:8px;top:8px;display:flex;gap:4px;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
body.glass .badge{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--glb)}
.badge svg{width:12px;height:12px}
.card h3{font-size:14px;font-weight:600;line-height:1.3;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.wide .im{aspect-ratio:16/9}
.card.wide video{width:100%;height:100%;object-fit:cover;display:block}
#st{padding:40px 0;text-align:center;color:var(--mut)}
#more{display:block;margin:28px auto;padding:10px 28px;border-radius:999px;border:1px solid var(--fg)}
#more[hidden]{display:none}
.skel{aspect-ratio:2/3;border-radius:14px;background:var(--card);animation:p 1.2s ease-in-out infinite alternate}
@keyframes p{to{opacity:.4}}
#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);padding:24px}
#gate[hidden]{display:none}
#gate div{max-width:380px;text-align:center;display:grid;gap:14px;justify-items:center}
#gate h1{font-size:28px;letter-spacing:-.03em}
#gate p{color:var(--mut)}
#gate .r{display:flex;gap:10px}
#gate button{padding:10px 24px;border-radius:999px;border:1px solid var(--fg)}
#gate button.p{background:var(--fg);color:var(--bg)}
body{touch-action:manipulation}
body.glass.refract .gl{backdrop-filter:url(#lg) blur(14px) saturate(190%)}
dialog{border:1px solid var(--line);border-radius:24px;padding:0;max-width:min(760px,94vw);width:100%;max-height:90vh;color:var(--fg);background:var(--bg);overflow:auto}
dialog::backdrop{background:#0008;backdrop-filter:blur(6px)}
body.glass dialog{background:var(--gl);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);border-color:var(--glb)}
.dm{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px}
.dm img.cv{width:100%;border-radius:14px;aspect-ratio:2/3;object-fit:cover}
body.blur .dm img.cv{filter:blur(16px) grayscale(1)}
body.blur .dm img.cv:hover{filter:none}
.dm h2{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.dm .tg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dm .tg span{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px}
.dm .ds{max-height:30vh;overflow:auto;color:var(--mut);font-size:14px;white-space:pre-line}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{display:inline-flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;border:1px solid var(--fg);font-size:13px;text-decoration:none;color:var(--fg)}
.btn[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.sm{padding:0 20px 20px}.sm .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
#xd{position:sticky;top:8px;float:right;margin:8px 8px 0 0;z-index:2}
#pn{position:fixed;inset:0;z-index:200;background:#fff}
#pn[hidden]{display:none}
#adv{margin-bottom:12px;font-size:13px;color:var(--mut)}
#adv summary{cursor:pointer}
#adv .fr{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#adv input{width:120px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
#adv input.w{width:210px}
@media(max-width:640px){nav.tabs button{padding:8px 12px;gap:6px}.dm{grid-template-columns:1fr}.dm img.cv{max-width:160px}}
@media(max-width:640px){header{flex-wrap:wrap}.logo span{display:none}form.bar{order:3;flex-basis:100%;max-width:none}.acts{margin-left:auto}.grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== giao diện v2 ===== */
:root{--r:20px;--sh2:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.08)}
html[data-theme=dark]{--sh2:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5)}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
html[data-theme=light] body::before{background:radial-gradient(45vmax 45vmax at 12% 6%,rgba(0,0,0,.09),transparent),radial-gradient(40vmax 40vmax at 95% 35%,rgba(0,0,0,.06),transparent),radial-gradient(50vmax 50vmax at 30% 100%,rgba(0,0,0,.08),transparent)}
html[data-theme=dark] body::before{background:radial-gradient(45vmax 45vmax at 12% 6%,rgba(255,255,255,.16),transparent),radial-gradient(40vmax 40vmax at 95% 35%,rgba(255,255,255,.1),transparent),radial-gradient(50vmax 50vmax at 30% 100%,rgba(255,255,255,.13),transparent)}
svg.i{stroke-width:1.75}
header{padding:14px 18px 8px;border:0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
body.glass header{background:transparent;backdrop-filter:none}
.logo{font-size:19px}.logo svg{width:32px;height:32px}
form.bar{height:48px;padding:0 6px 0 16px;box-shadow:var(--sh2)}
form.bar>svg{color:var(--mut)}
.acts{padding:4px;box-shadow:var(--sh2)}
.ib{width:38px;height:38px}
nav.tabs{width:max-content;max-width:calc(100% - 32px);margin:6px auto 0;padding:4px;gap:2px;justify-content:flex-start;border-radius:999px;background:var(--card);border:1px solid var(--line)}
nav.tabs button{border:0;padding:8px 16px;font-size:14px;font-weight:500}
nav.tabs button[aria-selected=true]{border:0;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 1px var(--line)}
html[data-theme=dark] nav.tabs button[aria-selected=true]{background:#2b2b2b;box-shadow:0 1px 3px rgba(0,0,0,.6)}
body.glass nav.tabs{background:var(--gl);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-color:var(--glb)}
.card .im{border:0;border-radius:var(--r);box-shadow:var(--sh2)}
.card:hover .im{box-shadow:0 14px 36px rgba(0,0,0,.28)}
.card h3{margin-top:10px;font-size:14px}
.badge{left:auto;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;border:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{padding:9px 15px;font-weight:500;border:1px solid var(--line);background:var(--card)}
.btn svg{width:16px;height:16px}
.btn[aria-pressed=true],.btn.pr{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools .btn{padding:6px 12px;font-size:12.5px;background:transparent}
dialog{border-radius:28px;max-width:min(720px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.glass dialog{background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);box-shadow:inset 0 1px 0 var(--glb),0 30px 80px rgba(0,0,0,.45)}
#xd{top:10px;margin:10px 10px 0 0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
.dm{grid-template-columns:150px 1fr;gap:18px;padding:22px 22px 4px;align-items:start}
.dm img.cv{border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dm h2{font-size:21px;font-weight:700}
.dm .mt{color:var(--mut);font-size:13px;margin-top:4px}
.dm .tg span{border:0;background:var(--card);color:var(--fg);padding:4px 10px}
.db{padding:6px 22px 8px}
.db .ds{max-height:26vh;line-height:1.55}
.ac{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.sm{padding:10px 22px 22px}
@media(max-width:640px){.dm{grid-template-columns:104px 1fr;gap:14px;padding:18px 18px 4px}.dm img.cv{max-width:none}.dm h2{font-size:18px}.db{padding:6px 18px 8px}.sm{padding:10px 18px 20px}}
@media(max-width:480px){nav.tabs{width:calc(100% - 32px)}nav.tabs button{flex:1;justify-content:center;padding:9px 6px;font-size:13px}nav.tabs svg{display:none}}

/* ===== mobile v3: không zoom, bottom sheet ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px}
.card:hover img{transform:none}
body:has(dialog[open]){overflow:hidden}
dialog[open]{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(max-width:640px){
body{font-size:14px}
header{padding:10px 14px 6px;gap:10px}
form.bar{height:46px}
.ib{width:40px;height:40px}
main{padding:12px 14px calc(28px + env(safe-area-inset-bottom))}
.grid{gap:14px 10px}
.card h3{font-size:13px;margin-top:8px}.card p{font-size:11.5px}
.tools{font-size:12px}
dialog{max-width:100%;width:100%;max-height:92vh;max-height:92dvh;margin:auto 0 0;border-radius:26px 26px 0 0;border-bottom:0}
#dc::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--mut);opacity:.5;margin:8px auto 0}
#xd{width:34px;height:34px;top:6px;margin:4px 10px 0 0}
.dm{padding-top:10px}
.dm h2{font-size:17px}
.dm .mt{font-size:12px}
.dm .tg span{font-size:11.5px;padding:3px 9px}
.db .ds{font-size:13.5px;max-height:22vh}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac .btn{justify-content:center;padding:11px 10px}
.sm{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.sm .grid{grid-template-columns:repeat(3,1fr);gap:12px 8px}
.sm .card h3{font-size:12px}.sm .card p{display:none}
}
html{overscroll-behavior-y:none}dialog{overscroll-behavior:contain}main,#dc{will-change:transform}

/* ===== v4: trang chủ, gợi ý, chi tiết, cá nhân hóa ===== */
.tools[hidden]{display:none}
.logo{cursor:pointer}
form.bar{position:relative}
#ac{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:40;max-height:60vh;overflow:auto;border-radius:20px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--sh2)}
#ac[hidden]{display:none}
body.glass #ac{background:var(--gl);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border-color:var(--glb)}
.sgl{padding:10px 16px 4px;font-size:12px;color:var(--mut)}
.sgi{display:flex;gap:12px;align-items:center;width:100%;padding:9px 16px;text-align:left}
.sgi:hover,.sgi:focus-visible{background:var(--card)}
.sgi img{width:36px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--card)}
body.blur .sgi img{filter:blur(8px) grayscale(1)}
.sgi span{min-width:0;flex:1;display:block;font-size:14px;line-height:1.3}
.sgi small{display:block;color:var(--mut);font-size:12px}
.sgi>svg{color:var(--mut)}
.home{display:block}
.ht{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.ht .btn{flex:none}
.hr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 8px;scrollbar-width:none}
.hr::-webkit-scrollbar{display:none}
.hr .card{flex:none;width:140px;scroll-snap-align:start}
.hs{margin-bottom:22px}
.hh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.hh h2{font-size:18px;letter-spacing:-.02em}
.lk{font-size:13px;color:var(--mut)}
.qc{flex:1;min-width:0;padding-bottom:2px}
.qc .chip{flex:none;white-space:nowrap}
#ex{padding:0 22px}
.ix{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:6px 0 4px;font-size:13px}
.ix span{display:block;color:var(--mut);font-size:12px}
.stl{text-decoration:underline;text-underline-offset:3px;color:var(--fg)}
.sec{margin:16px 0 4px}.sec>b{font-size:15px}.sec .hr{margin-top:10px}
.ch{flex:none;width:76px;text-align:center;font-size:12px;line-height:1.3}
.ch img{width:76px;height:76px;border-radius:50%;object-fit:cover;display:block;margin-bottom:6px;background:var(--card)}
.ch small{color:var(--mut);display:block}
body.blur .ch img{filter:blur(10px) grayscale(1)}
.ac2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pv{margin-top:14px;display:grid;gap:8px}
.rt{display:flex;gap:2px}
.rt button{color:var(--mut);opacity:.35;padding:4px}
.rt .on{opacity:1;color:var(--fg)}
.rt svg{width:24px;height:24px}
#nt{width:100%;resize:none;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:16px}
@media(max-width:640px){.hr .card{width:118px}#ex .hr .card{width:100px}#ex{padding:0 18px}}

/* ===== v5: đăng nhập, cài đặt, tiện ích ===== */
.fi{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px}
.fi[readonly]{opacity:.6}
#auth{position:fixed;inset:0;z-index:98;display:grid;place-items:center;background:var(--bg);padding:24px;overflow:auto}
#auth[hidden]{display:none}
#auth form{width:100%;max-width:360px;display:grid;gap:12px;text-align:center;justify-items:stretch}
#auth form>svg{justify-self:center}
#auth h1{font-size:26px;letter-spacing:-.03em}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:8px;border-radius:999px;color:var(--mut);font-weight:500}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 1px var(--line)}
html[data-theme=dark] .seg button[aria-pressed=true]{background:#2b2b2b}
.ck{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--mut)}
#am{min-height:20px;font-size:13px;font-weight:500}
.btn.big{justify-content:center;padding:13px 18px;font-size:15px}
.btn:disabled{opacity:.45}
.lk2{color:var(--mut);font-size:13px;padding:6px;text-decoration:underline;text-underline-offset:3px}
.sm2{color:var(--mut);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;padding:10px 18px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:13px;max-width:90vw;box-shadow:var(--sh2);text-align:center}
#toast[hidden]{display:none}
.badge.my{left:8px;right:auto;background:var(--fg);color:var(--bg)}
.pf{padding:18px 22px 24px}
#xp{float:right}
.pf h2{font-size:21px;letter-spacing:-.02em}
.pf .ix{margin-top:14px}
.pf .sec{margin:18px 0 4px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sw input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
.sw input[type=checkbox]:checked{background:var(--fg)}
.sw input[type=checkbox]:checked::after{transform:translateX(18px);background:var(--bg)}
.blk{display:grid;gap:8px;padding:12px 0;font-size:14px}
#pwf{display:grid;gap:8px;margin-top:10px}
#pwf[hidden]{display:none}
#svq{flex:1;min-width:160px;padding:8px 14px}
@media(max-width:640px){.pf::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--mut);opacity:.5;margin:-6px auto 10px}}

/* ===== v6: thu gọn mô tả, lưới ===== */
.ds.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;max-height:none!important}
.ds.open{max-height:40vh}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const BAD=/loli|shota|child|underage|toddler|infant|\bkid/i; // luôn ẩn nội dung liên quan đến trẻ vị thành niên
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UKEYS=new Set(['saved','views','notes','hist','prefs','hidden']);
const kk=k=>UKEYS.has(k)&&S.user?'u:'+S.user+':'+k:k; // khách dùng khóa gốc, mỗi tài khoản có vùng dữ liệu riêng
const ls={get(k){try{return localStorage.getItem(kk(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(kk(k),v)}catch(e){}}};
const M={};const S={user:null,locked:false,tab:'text',page:1,next:false,tags:new Set(),allTags:null,busy:false};

/* preferences */
function apply(){
  const g=ls.get('glass')!=='0',b=ls.get('blur')!=='0';
  const dark=ls.get('theme')?ls.get('theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.body.classList.toggle('glass',g);document.body.classList.toggle('blur',b);
  document.documentElement.dataset.theme=dark?'dark':'light';
  $('#tg').setAttribute('aria-pressed',g);$('#tb').setAttribute('aria-pressed',b);$('#tb').innerHTML=`<svg class="i"><use href="#i-${b?'eyeoff':'eye'}"/></svg>`;
  $('#tt').innerHTML=`<svg class="i"><use href="#i-${dark?'sun':'moon'}"/></svg>`;
}
$('#tg').onclick=()=>{ls.set('glass',ls.get('glass')==='0'?'1':'0');apply()};
$('#tb').onclick=()=>{ls.set('blur',ls.get('blur')==='0'?'1':'0');apply()};
$('#tt').onclick=()=>{ls.set('theme',document.documentElement.dataset.theme==='dark'?'light':'dark');apply()};
apply();

/* age gate */
if(ls.get('age18')==='1')$('#gate').hidden=true;
$('#yes').onclick=()=>{ls.set('age18','1');$('#gate').hidden=true;boot()};
$('#no').onclick=()=>{location.href='about:blank'};

/* AniList */
const FLD='id idMal siteUrl title{romaji english} coverImage{large color} seasonYear averageScore episodes description(asHtml:false) genres tags{name} studios(isMain:true){nodes{name}}';
const MAP={q:['search','String'],tags:['tag_in','[String]'],tn:['tag_not_in','[String]'],yg:['startDate_greater','FuzzyDateInt'],yl:['startDate_lesser','FuzzyDateInt'],sg:['averageScore_greater','Int'],el:['episodes_lesser','Int'],st:['status_not','MediaStatus'],sf:['status','MediaStatus']};
function mkQ(v){let d='$p:Int,$sort:[MediaSort]',a='';for(const k in MAP)if(v[k]!=null){d+=`,$${k}:${MAP[k][1]}`;a+=`,${MAP[k][0]}:$${k}`}
  return `query(${d}){Page(page:$p,perPage:24){pageInfo{hasNextPage total}media(type:ANIME,isAdult:true,sort:$sort${a}){${FLD}}}}`}
const REQ=[],CACHE=new Map(),INFL=new Map(),LIM=80,TTL=6e5;
const reqCount=()=>{const t=Date.now();while(REQ.length&&t-REQ[0]>6e4)REQ.shift();return REQ.length};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function slot(){while(reqCount()>=LIM){const w=6e4-(Date.now()-REQ[0])+50;toast('Đang chờ giới hạn tốc độ ('+Math.ceil(w/1000)+'s)…');await sleep(Math.min(w,3000))}REQ.push(Date.now())}
async function gql(query,variables){
  const key=query+JSON.stringify(variables||{}),c=CACHE.get(key);
  if(c&&Date.now()-c.t<TTL)return c.d;
  if(INFL.has(key))return INFL.get(key);
  const p=(async()=>{
    for(let a=0;a<3;a++){
      await slot();
      const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables})});
      if(r.status===429){const w=(+r.headers.get('Retry-After')||5)*1000;toast('AniList giới hạn tốc độ, thử lại sau '+Math.ceil(w/1000)+'s…');await sleep(Math.min(w,15000));continue}
      const j=await r.json();if(j.errors)throw new Error(j.errors[0].message);
      CACHE.set(key,{t:Date.now(),d:j.data});if(CACHE.size>200)CACHE.delete(CACHE.keys().next().value);
      return j.data;
    }
    throw new Error('AniList đang giới hạn tốc độ, thử lại sau vài giây.');
  })();
  INFL.set(key,p);try{return await p}finally{INFL.delete(key)}
}
const star='<svg class="i"><use href="#i-star"/></svg>';
function card(m){
  const t=m.title.english||m.title.romaji,st=m.studios.nodes[0]?.name||'',meta=[m.seasonYear,m.episodes?m.episodes+' tập':'',st].filter(Boolean).join(' · ');
  M[m.id]=m;return `<a class="card" data-id="${m.id}" href="${esc(m.siteUrl)}" target="_blank" rel="noopener noreferrer"><div class="im" style="background:${esc(m.coverImage.color||'')}22"><img loading="lazy" src="${esc(m.coverImage.large)}" alt="${esc(t)}">${m.averageScore?`<span class="badge">${star}${(m.averageScore/10).toFixed(1)}</span>`:''}${NT.get()[m.id]?.r?`<span class="badge my">${star}${NT.get()[m.id].r}</span>`:''}</div><h3>${esc(t)}</h3><p>${esc(meta)}</p></a>`;
}
const blkL=()=>{const t=PF.get().blocked.split(',').map(x=>x.trim()).filter(Boolean);return t.length?t:null};
const blkHit=m=>{const b=(blkL()||[]).map(x=>x.toLowerCase());return b.length&&[...m.genres,...m.tags.map(t=>t.name)].some(n=>b.includes(n.toLowerCase()))};
const HD={c:null,get(){if(!this.c){try{this.c=new Set(JSON.parse(ls.get('hidden')||'[]'))}catch(e){this.c=new Set()}}return this.c},add(id){this.get().add(id);ls.set('hidden',JSON.stringify([...this.c]))},clear(){this.c=new Set();ls.set('hidden','[]')}};
const DN={c:null,has(id){if(!this.c)this.c=new Set(Object.entries(SV.get()).filter(([k,e])=>e.l.includes('done')).map(([k])=>+k));return this.c.has(id)}};
const safe=m=>!m.tags.some(t=>BAD.test(t.name))&&!m.genres.some(g=>BAD.test(g))&&!blkHit(m)&&!HD.get().has(m.id)&&!(PF.get().hideDone&&DN.has(m.id));

const num=id=>{const v=$(id).value;return v===''?null:+v};
function vars(q,sort){const yg=num('#yg'),yl=num('#yl'),tn=[...$('#tn').value.split(','),...PF.get().blocked.split(',')].map(x=>x.trim()).filter(Boolean);return{q,tags:S.tab==='content'&&S.tags.size?[...S.tags]:null,tn:tn.length?tn:null,sort:[sort],yg:yg?yg*10000:null,yl:yl?yl*10000+1231:null,sg:num('#sg'),el:num('#el'),st:S.list&&S.preset?.st||null,sf:S.list&&S.preset?.sf||null}}
async function run(reset){
  if(S.busy||$('#gate').hidden===false||$('#auth').hidden===false)return;
  const q=$('#q').value.trim();
  if(S.tab==='saved')return showSaved();
  if(reset)syncHash(q);
  if(S.tab==='image'){if(/^https?:\/\//i.test(q))return traceUrl(q);return}
  const act=q||S.list||['#yg','#yl','#sg','#el','#sd','#tn'].some(i=>$(i).value.trim());
  if(S.tab==='text'&&!act)return home();
  $('#res').className='grid';$('#tools').hidden=false;$('#hm').hidden=!(S.tab==='text'&&S.list);
  S.busy=true;
  if(reset){S.page=1;$('#res').innerHTML=Array(8).fill('<div class="skel"></div>').join('');$('#st').textContent='';}
  $('#more').hidden=true;
  try{
    const byDesc=S.tab==='content'&&q;
    const sort=q&&!byDesc&&$('#sort').value==='POPULARITY_DESC'?'SEARCH_MATCH':$('#sort').value;
    const v=vars(byDesc?null:(q||null),sort);
    const words=q.toLowerCase().split(/\s+/).filter(Boolean),sd=$('#sd').value.trim().toLowerCase();
    const ok=m=>safe(m)&&(!byDesc||words.every(w=>(m.description||'').toLowerCase().includes(w)))&&(!sd||(m.studios.nodes[0]?.name||'').toLowerCase().includes(sd));
    let list=[],d,n=0;

/* kéo giãn kiểu iOS (rubber band): offset = (1 - 1/(c*x/d + 1)) * d, c = 0,55 */
function rubber(sc,el,end,skip){
  const win=sc===document.scrollingElement,ev=win?document:sc;
  let y0=0,on=false,dir=0,off=0;
  const D=()=>win?innerHeight:sc.clientHeight;
  const f=x=>{const d=D();return(1-1/(.55*x/d+1))*d};
  const top=()=>sc.scrollTop<=0,bot=()=>sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
  ev.addEventListener('touchstart',e=>{if(skip&&skip())return;y0=e.touches[0].clientY;on=false;el.style.transition='none'},{passive:true});
  ev.addEventListener('touchmove',e=>{
    if(skip&&skip())return;
    const y=e.touches[0].clientY;
    if(!on){const dy=y-y0;if(dy>6&&top())dir=1;else if(dy<-6&&bot())dir=-1;else return;on=true;y0=y}
    const x=(y-y0)*dir;
    if(x<=0){on=false;y0=y;el.style.transform='';return}
    if(e.cancelable)e.preventDefault();
    off=dir*f(x);el.style.transform=`translateY(${off}px)`;
  },{passive:false});
  const rel=()=>{if(!on)return;on=false;el.style.transition='transform .55s cubic-bezier(.2,1,.3,1)';el.style.transform='';if(end)end(off)};
  ev.addEventListener('touchend',rel);ev.addEventListener('touchcancel',rel);
}

  let H=Uint32Array.from(SHc);const R=(x,k)=>(x>>>k)|(x<<(32-k));

  if(pwMode==='del'){if(!confirm('Xóa vĩnh viễn tài khoản @'+u+' cùng toàn bộ dữ liệu?'))return;delUser(u);delete acc[u];ACC.put(acc);return signOut()}
  const n=$('#pw2').value;if(n.length<8)return m('Mật khẩu mới tối thiểu 8 ký tự.');
  const salt=crypto.getRandomValues(new Uint8Array(16));acc[u]={...a,s:b64(salt),h:await hashPw(n,salt)};ACC.put(acc);
  $('#pwf').hidden=true;$('#pw1').value=$('#pw2').value='';toast('Đã đổi mật khẩu');
}
$('#tp').onclick=openPf;
pfd.addEventListener('click',async e=>{
  if(e.target===pfd||e.target.closest('#xp'))return pfd.close();
  if(e.target.id==='pws')return pwSubmit();
  const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa;
  if(a==='out')signOut();
  else if(a==='lock')lockNow();
  else if(a==='chg'||a==='del'){pwMode=a;$('#pwf').hidden=false;$('#pw2').hidden=a==='del';$('#pwm').textContent='';$('#pw1').focus()}
  else if(a==='exp')$('#ex').click();
  else if(a==='imp')$('#im').click();
  else if(a==='uh'){HD.clear();toast('Đã bỏ ẩn tất cả');openPf()}
  else if(a==='cv'){ls.set('views','[]');toast('Đã xóa lịch sử xem');openPf()}
  else if(a==='ca'&&confirm('Xóa toàn bộ phim đã lưu, ghi chú và lịch sử của hồ sơ này?')){ls.set('saved','{}');ls.set('notes','{}');ls.set('views','[]');ls.set('hist','[]');HD.clear();NT.c=null;drawHist();toast('Đã xóa dữ liệu');openPf()}
});
pfd.addEventListener('change',e=>{const t=e.target;
  if(t.id==='pp')PF.set({priv:t.checked});
  else if(t.id==='pa')PF.set({autotr:t.checked});
  else if(t.id==='pcv')PF.set({cover:t.checked});
  else if(t.id==='phd'){PF.set({hideDone:t.checked});toast('Áp dụng từ lần tìm kế tiếp')}
  else if(t.id==='pgs'){PF.set({grid:t.value});applyGrid()}
  else if(t.id==='pl'){PF.set({lock:+t.value});idleInit()}
  else if(t.id==='pb'){PF.set({blocked:t.value});CACHE.clear();toast('Đã cập nhật thẻ ẩn')}
});

/* phím tắt: / tìm kiếm · h trang chủ · r ngẫu nhiên · 1-4 chuyển tab */
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||(e.target.closest&&e.target.closest('input,textarea,select'))||dlg.open||pfd.open||!authEl.hidden||!$('#gate').hidden)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus()}
  else if(e.key==='h')goHome();
  else if(e.key==='r')rnd().catch(()=>{});
  else if(/^[1-4]$/.test(e.key))setTab(['text','content','image','saved'][+e.key-1]);
});

/* tabs */
function setTab(t,nr){
  S.tab=t;S.list=false;S.preset=null;$('#tools').hidden=false;$('#res').className='grid';
  $$('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  $('#pc').hidden=t!=='content';$('#drop').hidden=t!=='image';$('#sort').closest('label').hidden=t==='image'||t==='saved';$('#sv').hidden=t!=='saved';$('#adv').hidden=t==='image'||t==='saved';
  $('#q').placeholder=t==='image'?'Dán liên kết ảnh rồi nhấn Enter…':t==='content'?'Mô tả nội dung, ví dụ: teacher office…':'Nhập tên phim…';
  $('#res').innerHTML='';$('#st').textContent='';$('#cnt').textContent='';$('#more').hidden=true;
  if(t==='content')loadTags().then(drawChips);
  if(t!=='image'&&!nr)run(true);
}
$$('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
S.tab0=readHash();boot();
